<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Killette Guitar Builder</title>
<style>
  :root {
    --bg: #0a0908;
    --panel: #12100e;
    --panel-edge: #2e2418;
    --ink: #f5f0e8;
    --muted: #9a8f82;
    --accent: #c9a227;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 2px solid var(--accent);
  }
  header h1 {
    font-size: 15px; margin: 0; letter-spacing: .14em; text-transform: uppercase;
  }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  button {
    background: #221c14; color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 7px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #1d1508;
    font-weight: 700; letter-spacing: .06em;
  }
  #layout { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 300px; min-width: 230px;
    background: var(--panel); border-right: 1px solid var(--panel-edge);
    overflow-y: auto; padding: 12px;
  }
  aside .hint { font-size: 12px; color: var(--muted); line-height: 1.6; padding: 4px 4px 0; }
  .slot-group h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--accent); margin: 14px 4px 6px;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .part {
    background: #1a1611; border: 1px solid #2c2418; border-radius: 8px;
    padding: 6px; cursor: pointer; text-align: center;
    transition: border-color .15s;
  }
  .part:hover { border-color: var(--accent); }
  .part.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .part img { width: 100%; height: 58px; object-fit: contain; pointer-events: none; }
  .part span {
    display: block; font-size: 9.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  main { flex: 1; position: relative; overflow: hidden; }
  #bench {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 42%, #17130d 0%, var(--bg) 78%);
  }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .inst { position: absolute; user-select: none; -webkit-user-drag: none; cursor: grab; }
  .inst:active { cursor: grabbing; }
  .inst.selected { outline: 2px dashed var(--accent); outline-offset: 3px; }
  #empty-hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--muted); font-size: 14px; text-align: center; line-height: 1.9;
    pointer-events: none;
  }
  #sel-tools {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: none; gap: 8px; background: var(--panel);
    border: 1px solid var(--panel-edge); border-radius: 10px; padding: 8px;
    z-index: 40;
  }
  #sel-tools.visible { display: flex; }
  #sel-tools .label {
    align-self: center; font-size: 12px; color: var(--muted);
    padding: 0 6px; max-width: 200px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #sel-tools button.danger { color: #c25444; }
  @media (max-width: 700px) {
    aside { width: 44%; min-width: 170px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>Killette <span>Guitar Builder</span></h1>
  <span style="font-size:11px;color:var(--muted)">build your monster 🤘</span>
  <div class="spacer"></div>
  <button id="randomize">Surprise me</button>
  <button id="clear">Clear</button>
  <button id="export" class="primary">⬇ Save my guitar</button>
</header>

<div id="layout">
  <aside>
    <div class="hint">
      Tap a part to put it on the bench. Tap a placed part, then
      <b>◀ ▶</b> to swap it for another. Drag anything to fine-tune.
      Hit <b>Save my guitar</b> to download your build.
    </div>
    <div id="shelf"></div>
  </aside>
  <main>
    <div id="bench"><div id="world"></div></div>
    <div id="empty-hint">Pick parts from the shelf 🎸</div>
    <div id="sel-tools">
      <span class="label" id="sel-label"></span>
      <button id="swap-prev">◀ swap</button>
      <button id="swap-next">swap ▶</button>
      <button id="remove" class="danger">remove</button>
    </div>
  </main>
</div>

<script>
"use strict";
const CORE_SLOTS = ["body", "neck", "headstock"];
const Z_ORDER = { body: 1, neck: 2, headstock: 3, other: 9 };

let manifest = { ppi: 48, components: [] };
let instances = [];
let selectedUid = null;
let nextUid = 1;
let viewScale = 0.35;

const $ = id => document.getElementById(id);
const world = $("world");
const bench = $("bench");
const shelf = $("shelf");

const partById = id => manifest.components.find(c => c.id === id);
const partsInSlot = slot => manifest.components.filter(c => (c.slot || "other") === slot);
const slotOf = part => part.slot || "other";
const isCore = part => CORE_SLOTS.includes(slotOf(part));

function anchor(part, name) {
  const a = part.anchors || {};
  if (a[name]) return a[name];
  const w = part.width_px, h = part.height_px;
  switch (name) {
    case "pocket": return [w / 2, h * 0.06];
    case "top":    return [w / 2, 0];
    case "bottom": return [w / 2, h];
    default:       return [w / 2, h / 2];
  }
}

function pocketWorld() {
  const ppi = manifest.ppi || 48;
  return { x: 12 * ppi, y: 21 * ppi };
}

function solveCoreLayout() {
  const P = pocketWorld();
  const body = instances.find(i => slotOf(i.part) === "body");
  const neck = instances.find(i => slotOf(i.part) === "neck");
  const head = instances.find(i => slotOf(i.part) === "headstock");
  if (body) {
    const [ax, ay] = anchor(body.part, "pocket");
    body.x = P.x - ax + body.dx; body.y = P.y - ay + body.dy;
  }
  if (neck) {
    const [bx, by] = anchor(neck.part, "bottom");
    neck.x = P.x - bx + neck.dx; neck.y = P.y - by + neck.dy;
    if (head) {
      const [tx, ty] = anchor(neck.part, "top");
      const [hx, hy] = anchor(head.part, "bottom");
      head.x = (neck.x + tx) - hx + head.dx;
      head.y = (neck.y + ty) - hy + head.dy;
    }
  } else if (head) {
    const [hx, hy] = anchor(head.part, "bottom");
    head.x = P.x - hx + head.dx;
    head.y = P.y - 13 * (manifest.ppi || 48) - hy + head.dy;
  }
}

function placePart(part) {
  if (isCore(part)) {
    const existing = instances.find(i => slotOf(i.part) === slotOf(part));
    if (existing) existing.part = part;
    else instances.push({ uid: nextUid++, part, x: 0, y: 0, dx: 0, dy: 0 });
    solveCoreLayout();
  } else {
    const P = pocketWorld();
    instances.push({
      uid: nextUid++, part,
      x: P.x - part.width_px / 2, y: P.y + 6 * 48, dx: 0, dy: 0,
    });
  }
  render();
}

function swapInstance(inst, dir) {
  const options = partsInSlot(slotOf(inst.part));
  if (options.length < 2) return;
  const idx = options.findIndex(p => p.id === inst.part.id);
  inst.part = options[(idx + dir + options.length) % options.length];
  if (isCore(inst.part)) solveCoreLayout();
  render();
}

function removeInstance(uid) {
  instances = instances.filter(i => i.uid !== uid);
  if (selectedUid === uid) selectedUid = null;
  render();
}

function fitView() {
  const ppi = manifest.ppi || 48;
  viewScale = Math.min(
    bench.clientHeight * 0.94 / (41 * ppi),
    bench.clientWidth * 0.9 / (24 * ppi),
  );
  const offsetX = (bench.clientWidth - 24 * ppi * viewScale) / 2;
  world.style.transform =
    `translate(${offsetX}px, ${bench.clientHeight * 0.03}px) scale(${viewScale})`;
}

function render() {
  world.innerHTML = "";
  const sorted = [...instances].sort(
    (a, b) => (Z_ORDER[slotOf(a.part)] || 9) - (Z_ORDER[slotOf(b.part)] || 9)
  );
  for (const inst of sorted) {
    const img = document.createElement("img");
    img.src = "parts/" + inst.part.file;
    img.className = "inst" + (inst.uid === selectedUid ? " selected" : "");
    img.style.left = inst.x + "px";
    img.style.top = inst.y + "px";
    img.style.width = inst.part.width_px + "px";
    img.draggable = false;
    img.dataset.uid = inst.uid;
    img.addEventListener("pointerdown", e => startDrag(inst, e));
    world.appendChild(img);
  }
  $("empty-hint").style.display = instances.length ? "none" : "";
  renderSelTools();
  renderShelf();
}

function renderSelTools() {
  const tools = $("sel-tools");
  const inst = instances.find(i => i.uid === selectedUid);
  tools.classList.toggle("visible", !!inst);
  if (inst) {
    const n = partsInSlot(slotOf(inst.part)).length;
    $("sel-label").textContent = `${inst.part.id} (${n} option${n === 1 ? "" : "s"})`;
    $("swap-prev").disabled = $("swap-next").disabled = n < 2;
  }
}

function renderShelf() {
  shelf.innerHTML = "";
  const bySlot = {};
  for (const c of manifest.components) (bySlot[slotOf(c)] ||= []).push(c);
  const order = ["body", "neck", "headstock"];
  const slots = Object.keys(bySlot).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  const placedIds = new Set(instances.map(i => i.part.id));
  for (const slot of slots) {
    const group = document.createElement("div");
    group.className = "slot-group";
    group.innerHTML = `<h2>${slot.replaceAll("_", " ")}s</h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const part of bySlot[slot]) {
      const card = document.createElement("div");
      card.className = "part" + (placedIds.has(part.id) ? " active" : "");
      card.title = part.id;
      card.innerHTML =
        `<img loading="lazy" src="parts/${part.thumbnail}" alt="${part.id}">` +
        `<span>${part.id.split("/")[1]}</span>`;
      card.addEventListener("click", () => placePart(part));
      grid.appendChild(card);
    }
    group.appendChild(grid);
    shelf.appendChild(group);
  }
}

function startDrag(inst, e) {
  selectedUid = inst.uid;
  render();
  const startX = e.clientX, startY = e.clientY;
  const origX = inst.x, origY = inst.y;
  let moved = false;
  const move = ev => {
    const wx = (ev.clientX - startX) / viewScale;
    const wy = (ev.clientY - startY) / viewScale;
    if (Math.abs(wx) + Math.abs(wy) > 2) moved = true;
    inst.x = origX + wx; inst.y = origY + wy;
    const el = world.querySelector(`[data-uid="${inst.uid}"]`);
    if (el) { el.style.left = inst.x + "px"; el.style.top = inst.y + "px"; }
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    if (moved && isCore(inst.part)) {
      inst.dx += inst.x - origX;
      inst.dy += inst.y - origY;
    }
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  e.preventDefault();
  e.stopPropagation();
}

bench.addEventListener("pointerdown", e => {
  if (e.target === bench || e.target === world) { selectedUid = null; render(); }
});
window.addEventListener("keydown", e => {
  if (!selectedUid) return;
  const inst = instances.find(i => i.uid === selectedUid);
  if (!inst) return;
  if (e.key === "Delete" || e.key === "Backspace") removeInstance(selectedUid);
  if (e.key === "[") swapInstance(inst, -1);
  if (e.key === "]") swapInstance(inst, +1);
});
$("swap-prev").addEventListener("click", () => {
  const i = instances.find(i => i.uid === selectedUid); if (i) swapInstance(i, -1);
});
$("swap-next").addEventListener("click", () => {
  const i = instances.find(i => i.uid === selectedUid); if (i) swapInstance(i, +1);
});
$("remove").addEventListener("click", () => removeInstance(selectedUid));
$("clear").addEventListener("click", () => { instances = []; selectedUid = null; render(); });

$("randomize").addEventListener("click", () => {
  instances = []; selectedUid = null;
  for (const slot of CORE_SLOTS) {
    const opts = partsInSlot(slot);
    if (opts.length) placePart(opts[Math.floor(Math.random() * opts.length)]);
  }
});

$("export").addEventListener("click", async () => {
  if (!instances.length) return;
  const pad = 40;
  const xs = instances.map(i => i.x), ys = instances.map(i => i.y);
  const xe = instances.map(i => i.x + i.part.width_px);
  const ye = instances.map(i => i.y + i.part.height_px);
  const minX = Math.min(...xs) - pad, minY = Math.min(...ys) - pad;
  const w = Math.max(...xe) - minX + pad, h = Math.max(...ye) - minY + pad;
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(w); canvas.height = Math.round(h);
  const ctx = canvas.getContext("2d");
  const sorted = [...instances].sort(
    (a, b) => (Z_ORDER[slotOf(a.part)] || 9) - (Z_ORDER[slotOf(b.part)] || 9)
  );
  for (const inst of sorted) {
    const img = new Image();
    img.src = "parts/" + inst.part.file;
    await img.decode();
    ctx.drawImage(img, inst.x - minX, inst.y - minY, inst.part.width_px, inst.part.height_px);
  }
  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "my-killette.png";
    a.click();
    URL.revokeObjectURL(a.href);
  }, "image/png");
});

fetch("parts/manifest.json")
  .then(r => r.json())
  .then(m => {
    manifest = m;
    fitView();
    // open with a guitar already on the bench
    for (const slot of CORE_SLOTS) {
      const opts = partsInSlot(slot);
      if (opts.length) placePart(opts[0]);
    }
  });
window.addEventListener("resize", fitView);
</script>
</body>
</html>
