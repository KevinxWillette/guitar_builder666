<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Killy Killette — The Universe</title>
<style>
  :root {
    --bg: #080a0f;
    --panel: #12161f;
    --border: #2a3344;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #c9a227;
    --accent-glow: rgba(201, 162, 39, 0.35);
    --folk: #4a7c59;
    --metal: #8b2635;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: Georgia, "Times New Roman", serif; }
  #viewport {
    position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(74, 124, 89, 0.10), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(139, 38, 53, 0.12), transparent 45%),
      var(--bg);
  }
  #viewport.dragging { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

  .patch {
    position: absolute; border-radius: 10px; overflow: hidden; user-select: none; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.14);
    transition: box-shadow 0.25s, border-color 0.25s;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .patch:hover, .patch.focus { border-color: var(--accent); box-shadow: 0 0 34px var(--accent-glow); }
  .patch .art { position: absolute; inset: 0; }
  .patch .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .patch .veil { position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
    background: linear-gradient(transparent, rgba(4,6,10,0.92)); }
  .patch .txt { position: relative; padding: 12px 14px; }
  .patch .name { font-weight: 700; letter-spacing: 0.04em; text-shadow: 0 2px 10px #000; }
  .patch .kind { font: 10px system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 4px; text-shadow: 0 1px 6px #000; }
  .patch .tag { font: 11px system-ui, sans-serif; color: rgba(230,237,243,0.75); margin-top: 3px; text-shadow: 0 1px 6px #000; }
  .patch-root .name { font-size: 30px; letter-spacing: 0.1em; }
  .patch-realm .name { font-size: 20px; }
  .patch-album .name { font-size: 14px; }

  /* HUD */
  #brand {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; text-align: center;
    pointer-events: none;
  }
  #brand h1 { font-size: clamp(14px, 2.4vw, 21px); color: var(--accent); letter-spacing: 0.3em;
    text-transform: uppercase; text-shadow: 0 2px 24px rgba(0,0,0,0.9); }
  #brand p { font: 11px system-ui, sans-serif; color: var(--muted); letter-spacing: 0.14em; margin-top: 4px; }

  #controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60;
    display: flex; gap: 8px; align-items: center;
    background: rgba(14, 18, 26, 0.92); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 12px; box-shadow: 0 10px 36px rgba(0,0,0,0.55);
  }
  #controls button {
    background: #1c2330; color: var(--text); border: 1px solid var(--border); border-radius: 999px;
    font: 700 13px system-ui, sans-serif; letter-spacing: 0.06em;
    padding: 9px 16px; cursor: pointer; min-width: 44px;
  }
  #controls button:hover { border-color: var(--accent); color: var(--accent); }
  #controls button.primary { background: #2a2410; border-color: #6b5a20; color: var(--accent); min-width: 74px; }
  #controls button:active { transform: translateY(1px); }

  #caption {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 55;
    background: rgba(14, 18, 26, 0.9); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 16px; font-family: system-ui, sans-serif; text-align: center;
    max-width: min(480px, calc(100vw - 32px));
    opacity: 0; transition: opacity 0.35s; pointer-events: none;
  }
  #caption.show { opacity: 1; }
  #caption .c-name { color: var(--accent); font-weight: 700; font-size: 14px; font-family: Georgia, serif; letter-spacing: 0.06em; }
  #caption .c-tag { color: var(--muted); font-size: 11px; margin-top: 2px; }

  #hint {
    position: fixed; bottom: 18px; right: 16px; z-index: 50;
    font: 11px system-ui, sans-serif; color: rgba(139,148,158,0.75);
    background: rgba(8,10,15,0.6); padding: 6px 10px; border-radius: 6px; pointer-events: none;
  }
  @media (max-width: 640px) { #hint { display: none; } }

  /* Overlay card */
  #card-backdrop {
    position: fixed; inset: 0; z-index: 90; background: rgba(3, 5, 9, 0.72);
    backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; padding: 18px;
  }
  #card-backdrop.open { display: flex; }
  #card {
    width: min(500px, 100%); max-height: min(84vh, 640px); overflow: auto;
    background: var(--panel); border: 2px solid var(--accent); border-radius: 14px;
    box-shadow: 0 0 60px var(--accent-glow), 0 24px 64px rgba(0,0,0,0.65);
    animation: cardIn 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(22px) scale(0.97); } to { opacity: 1; transform: none; } }
  #card .cover { position: relative; height: 210px; }
  #card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #card .cover .veil { position: absolute; left: 0; right: 0; bottom: 0; height: 70%;
    background: linear-gradient(transparent, rgba(18,22,31,0.98)); }
  #card .cover .kind { position: absolute; top: 12px; left: 14px; font: 700 10px system-ui, sans-serif;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent);
    background: rgba(4,6,10,0.65); border: 1px solid rgba(201,162,39,0.4); border-radius: 4px; padding: 4px 8px; }
  #card .body { padding: 0 22px 22px; margin-top: -34px; position: relative; }
  #card h2 { color: var(--accent); font-size: 26px; letter-spacing: 0.05em; text-shadow: 0 2px 12px #000; }
  #card .tag { font: 12px system-ui, sans-serif; color: var(--muted); letter-spacing: 0.1em; margin: 4px 0 12px; }
  #card .desc { font: 14px/1.65 system-ui, sans-serif; color: #c4ccd8; white-space: pre-wrap; }
  #card .tracks { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  #card .tracks li { font: 13px/1.9 system-ui, sans-serif; color: #b8c0cc; list-style: none; }
  #card .tracks li::before { content: '♪  '; color: var(--accent); }
  #card .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  #card .links a {
    display: inline-block; text-decoration: none; font: 700 12px system-ui, sans-serif; letter-spacing: 0.05em;
    color: var(--accent); background: #2a2410; border: 1px solid #6b5a20; border-radius: 999px; padding: 9px 16px;
  }
  #card .links a:hover { filter: brightness(1.2); }
  #card .card-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
  #card .card-nav button {
    background: #1c2330; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    font: 700 12px system-ui, sans-serif; padding: 9px 14px; cursor: pointer;
  }
  #card .card-nav button:hover { border-color: var(--accent); color: var(--accent); }
  #card-close {
    position: absolute; top: 10px; right: 12px; z-index: 2;
    background: rgba(4,6,10,0.65); color: var(--text); border: 1px solid var(--border); border-radius: 50%;
    width: 34px; height: 34px; font: 700 15px system-ui, sans-serif; cursor: pointer;
  }
  #card-close:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div id="viewport"><div id="world"></div></div>

<div id="brand">
  <h1>Killy Killette</h1>
  <p>TROUBLE &amp; CO · THE UNIVERSE</p>
</div>

<div id="caption"><div class="c-name"></div><div class="c-tag"></div></div>

<div id="controls">
  <button id="btnBack" type="button" title="Previous stop">⟨ Back</button>
  <button id="btnGo" class="primary" type="button" title="Play the guided tour">Go ▶</button>
  <button id="btnFwd" type="button" title="Next stop">Fwd ⟩</button>
  <button id="btnHome" type="button" title="See the whole map">Map</button>
</div>

<div id="hint">scroll to zoom · drag to pan · click anything</div>

<div id="card-backdrop">
  <div id="card" role="dialog" aria-modal="true">
    <div class="cover">
      <button id="card-close" type="button" aria-label="Close">✕</button>
      <img alt="" />
      <div class="veil"></div>
      <div class="kind"></div>
    </div>
    <div class="body">
      <h2></h2>
      <div class="tag"></div>
      <div class="desc"></div>
      <ul class="tracks"></ul>
      <div class="links"></div>
      <div class="card-nav">
        <button id="cardPrev" type="button">⟨ Back</button>
        <button id="cardNext" type="button">Forward ⟩</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* =============================================================
   CONTENT — edit this block to change the website canvas.
   Each patch: id, kind, name, tag (small line under the name),
   desc (card text), img (cover URL — use your WordPress Media
   Library URLs; leave '' for the built-in artwork placeholder),
   links: [{label, url}], tracks: ['...'] (optional),
   x/y/w/h: position on the map.
   TOUR: the ordered list of patch ids Go/Back/Forward step through.
   ============================================================= */
const CONTENT = {
  patches: [
    {
      id: 'universe', kind: 'the universe', name: 'KILLY KILLETTE', tag: 'Appalachia folk · slam metal · Trouble & Co',
      desc: 'One world, two voices.\n\nKilly Killette sings the ridge — acoustic story songs from the whistlin pines. Roux Garoux drags the same hills through the amp — slam, deathcore, banjocore.\n\nClick a patch to step inside, or press Go and ride the tour.',
      img: '', palette: ['#1a1520', '#2a2035'], accent: '#c9a227',
      links: [],
      x: 4600, y: 4750, w: 1000, h: 660
    },
    {
      id: 'folk', kind: 'the folk side', name: 'KILLY KILLETTE', tag: 'Appalachia · acoustic · story songs',
      desc: 'The acoustic soul of the universe. Ridge life, whistlin pines, black bears and hollow-hills folklore — songs written on the porch and sung to the fence line.',
      img: '', palette: ['#1a2e1f', '#0f1a12'], accent: '#4a7c59',
      links: [{ label: '♫ Listen', url: '#' }],
      x: 4680, y: 4900, w: 380, h: 420
    },
    {
      id: 'metal', kind: 'the metal side', name: 'ROUX GAROUX', tag: 'slam · deathcore · banjocore',
      desc: 'The same hills, wired hot. Roux Garoux is the heavy production arm — SLAMLORD grooves, horror folklore, and a banjo that bites back.',
      img: '', palette: ['#2a1218', '#1a0a0e'], accent: '#8b2635',
      links: [{ label: '♫ Listen', url: '#' }],
      x: 5140, y: 4900, w: 380, h: 420
    },
    {
      id: 'appalachia', kind: 'album · killy killette', name: 'APPALACHIA', tag: 'the ridge album',
      desc: 'Story songs from the ridge — indifference, black bear, the law of the land. The heart of the folk catalog.',
      img: '', palette: ['#24402c', '#101d14'], accent: '#4a7c59',
      links: [{ label: '♫ Listen', url: '#' }, { label: 'Lyrics', url: '#' }],
      tracks: [],
      x: 4710, y: 5000, w: 150, h: 150
    },
    {
      id: 'moonbeam', kind: 'album · killy killette', name: 'MOONBEAM SAGA', tag: 'the night cycle',
      desc: 'The long-form night cycle — moonlight over the hollow, told in linked songs.',
      img: '', palette: ['#1e3040', '#0c141d'], accent: '#3d5a80',
      links: [{ label: '♫ Listen', url: '#' }],
      tracks: [],
      x: 4880, y: 5000, w: 150, h: 150
    },
    {
      id: 'black-bear', kind: 'single · killy killette', name: 'BLACK BEAR', tag: 'newest songs',
      desc: 'The newest of the story songs — fresh off the porch.',
      img: '', palette: ['#2c2418', '#15100a'], accent: '#6b4c35',
      links: [{ label: '♫ Listen', url: '#' }],
      x: 4795, y: 5165, w: 150, h: 120
    },
    {
      id: 'poetic-detritus', kind: 'album · roux garoux', name: 'POETIC DETRITUS', tag: 'final mix',
      desc: 'The flagship heavy record — poetry fed through the slam machine.',
      img: '', palette: ['#3a1520', '#180a0e'], accent: '#8b2635',
      links: [{ label: '♫ Listen', url: '#' }],
      tracks: [],
      x: 5170, y: 5000, w: 150, h: 150
    },
    {
      id: 'devils-banjo', kind: 'album · roux garoux', name: "DEVIL'S BANJO", tag: 'remastered',
      desc: 'Banjocore, remastered. The devil tunes it, Roux plays it.',
      img: '', palette: ['#301022', '#140812'], accent: '#8b2635',
      links: [{ label: '♫ Listen', url: '#' }],
      tracks: [],
      x: 5340, y: 5000, w: 150, h: 150
    },
    {
      id: 'hollow-hills', kind: 'single · roux garoux', name: 'THE HOLLOW IN THE HILLS', tag: 'appalachian horror',
      desc: 'Appalachian horror metal — the Ridge-Walker walks.',
      img: '', palette: ['#122828', '#081818'], accent: '#2d6a6a',
      links: [{ label: '♫ Listen', url: '#' }],
      x: 5255, y: 5165, w: 160, h: 120
    }
  ],
  tour: ['universe', 'folk', 'appalachia', 'moonbeam', 'black-bear', 'metal', 'poetic-detritus', 'devils-banjo', 'hollow-hills'],
  tourSeconds: 5
};
/* ============================ end of CONTENT ============================ */

const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
let cam = { x: 0, y: 0, scale: 0.5 };
let tourIdx = -1;
let touring = false;
let tourTimer = null;
let camAnim = null;
const pointers = new Map();
let panStart = null;
let pinchStart = null;
let moved = false;
let downPatchId = null;

function openPatchById(id) {
  const p = byId(id);
  if (!p) return;
  stopTour();
  const i = CONTENT.tour.indexOf(id);
  if (i >= 0) tourIdx = i;
  flyTo(p);
  openCard(p);
}

const byId = id => CONTENT.patches.find(p => p.id === id);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* placeholder cover art (SVG) when no image URL is set */
function placeholderArt(p) {
  const [c0, c1] = p.palette || ['#1a1520', '#2a2035'];
  const ac = p.accent || '#c9a227';
  const seed = p.id.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  let ridges = '';
  for (let i = 0; i < 4; i++) {
    const y = 42 + i * 15 + (seed % 7);
    ridges += `<path d="M0 ${y} L18 ${y - 10 - (seed + i * 13) % 8} L38 ${y - 2} L58 ${y - 12 - (seed + i * 7) % 6} L80 ${y - 4} L100 ${y - 11}" fill="none" stroke="${ac}" stroke-opacity="${0.28 - i * 0.05}" stroke-width="1.6"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${c0}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>
    <rect width="100" height="100" fill="url(#g)"/>${ridges}
    <circle cx="${20 + seed % 60}" cy="22" r="7" fill="${ac}" fill-opacity="0.35"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function artSrc(p) { return p.img && p.img.trim() ? p.img : placeholderArt(p); }

/* ---------- build the map ---------- */
function build() {
  world.innerHTML = '';
  const kindClass = p => p.id === 'universe' ? 'patch-root' : (p.w >= 300 ? 'patch-realm' : 'patch-album');
  for (const p of CONTENT.patches) {
    const el = document.createElement('div');
    el.className = 'patch ' + kindClass(p);
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.style.width = p.w + 'px';
    el.style.height = p.h + 'px';
    el.dataset.id = p.id;
    el.style.zIndex = String(Math.max(1, Math.round(1000000 / Math.sqrt(p.w * p.h))));
    el.innerHTML =
      `<div class="art"><img src="${artSrc(p)}" alt="${esc(p.name)}" draggable="false"/></div>` +
      `<div class="veil"></div>` +
      `<div class="txt"><div class="kind">${esc(p.kind)}</div><div class="name">${esc(p.name)}</div>` +
      (p.tag ? `<div class="tag">${esc(p.tag)}</div>` : '') + `</div>`;
    world.appendChild(el);
  }
}

/* ---------- camera ---------- */
function applyCamera() {
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
}
function screenToWorld(sx, sy) {
  return { x: (sx - cam.x) / cam.scale, y: (sy - cam.y) / cam.scale };
}
function animateTo(targetScale, targetX, targetY, dur) {
  if (camAnim) cancelAnimationFrame(camAnim);
  const start = { ...cam };
  const t0 = performance.now();
  function step(now) {
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    cam.scale = start.scale + (targetScale - start.scale) * e;
    cam.x = start.x + (targetX - start.x) * e;
    cam.y = start.y + (targetY - start.y) * e;
    applyCamera();
    if (t < 1) camAnim = requestAnimationFrame(step); else camAnim = null;
  }
  camAnim = requestAnimationFrame(step);
}
function flyTo(p, dur) {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const pad = Math.min(vw, vh) * 0.12;
  const targetScale = clamp(Math.min((vw - pad * 2) / p.w, (vh - pad * 2) / p.h), 0.1, 3);
  animateTo(targetScale, vw / 2 - (p.x + p.w / 2) * targetScale, vh / 2 - (p.y + p.h / 2) * targetScale, dur || 900);
  document.querySelectorAll('.patch.focus').forEach(x => x.classList.remove('focus'));
  const el = world.querySelector('.patch[data-id="' + p.id + '"]');
  if (el) el.classList.add('focus');
  showCaption(p);
}
function fitAll(dur) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of CONTENT.patches) {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h);
  }
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const pad = 60, bw = maxX - minX, bh = maxY - minY;
  const s = clamp(Math.min((vw - pad * 2) / bw, (vh - pad * 2) / bh), 0.05, 2);
  animateTo(s, (vw - bw * s) / 2 - minX * s, (vh - bh * s) / 2 - minY * s, dur || 900);
  document.querySelectorAll('.patch.focus').forEach(x => x.classList.remove('focus'));
  hideCaption();
}

/* ---------- caption ---------- */
const captionEl = document.getElementById('caption');
let captionTimer = null;
function showCaption(p) {
  captionEl.querySelector('.c-name').textContent = p.name;
  captionEl.querySelector('.c-tag').textContent = p.kind + (p.tag ? ' — ' + p.tag : '');
  captionEl.classList.add('show');
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => captionEl.classList.remove('show'), 3800);
}
function hideCaption() { captionEl.classList.remove('show'); clearTimeout(captionTimer); }

/* ---------- tour: Go / Stop / Back / Forward ---------- */
const btnGo = document.getElementById('btnGo');
function tourStep(dir) {
  stopTour();
  gotoStop(tourIdx < 0 ? (dir > 0 ? 0 : CONTENT.tour.length - 1)
                       : (tourIdx + dir + CONTENT.tour.length) % CONTENT.tour.length);
}
function gotoStop(i) {
  tourIdx = i;
  const p = byId(CONTENT.tour[i]);
  if (p) flyTo(p);
}
function startTour() {
  touring = true;
  btnGo.textContent = 'Stop ■';
  closeCard();
  gotoStop(tourIdx < 0 ? 0 : (tourIdx + 1) % CONTENT.tour.length);
  tourTimer = setInterval(() => gotoStop((tourIdx + 1) % CONTENT.tour.length), CONTENT.tourSeconds * 1000);
}
function stopTour() {
  if (!touring) return;
  touring = false;
  btnGo.textContent = 'Go ▶';
  clearInterval(tourTimer);
}
btnGo.addEventListener('click', () => touring ? stopTour() : startTour());
document.getElementById('btnBack').addEventListener('click', () => tourStep(-1));
document.getElementById('btnFwd').addEventListener('click', () => tourStep(1));
document.getElementById('btnHome').addEventListener('click', () => { stopTour(); tourIdx = -1; fitAll(); });

/* ---------- overlay card ---------- */
const backdrop = document.getElementById('card-backdrop');
const card = document.getElementById('card');
function openCard(p) {
  card.querySelector('.cover img').src = artSrc(p);
  card.querySelector('.cover .kind').textContent = p.kind;
  card.querySelector('h2').textContent = p.name;
  card.querySelector('.tag').textContent = p.tag || '';
  card.querySelector('.desc').textContent = p.desc || '';
  const tracks = card.querySelector('.tracks');
  tracks.innerHTML = (p.tracks || []).map(t => '<li>' + esc(t) + '</li>').join('');
  tracks.style.display = (p.tracks && p.tracks.length) ? '' : 'none';
  const links = card.querySelector('.links');
  links.innerHTML = (p.links || []).map(l =>
    '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>').join('');
  links.style.display = (p.links && p.links.length) ? '' : 'none';
  backdrop.classList.add('open');
}
function closeCard() { backdrop.classList.remove('open'); }
document.getElementById('card-close').addEventListener('click', closeCard);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeCard(); });
document.getElementById('cardPrev').addEventListener('click', () => { tourStep(-1); openCard(byId(CONTENT.tour[tourIdx])); });
document.getElementById('cardNext').addEventListener('click', () => { tourStep(1); openCard(byId(CONTENT.tour[tourIdx])); });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCard(); stopTour(); }
  if (e.key === 'ArrowLeft') tourStep(-1);
  if (e.key === 'ArrowRight') tourStep(1);
});

/* ---------- pan / zoom / pinch ---------- */
viewport.addEventListener('pointerdown', e => {
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  if (pointers.size === 1) {
    const hit = e.target.closest && e.target.closest('.patch');
    downPatchId = hit ? hit.dataset.id : null;
    panStart = { x: e.clientX, y: e.clientY, camX: cam.x, camY: cam.y };
    viewport.classList.add('dragging');
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = {
      dist: Math.hypot(a.x - b.x, a.y - b.y),
      scale: cam.scale,
      cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,
      camX: cam.x, camY: cam.y
    };
    panStart = null;
  }
});
viewport.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const ratio = dist / (pinchStart.dist || 1);
    const newScale = clamp(pinchStart.scale * ratio, 0.05, 4);
    const wx = (pinchStart.cx - pinchStart.camX) / pinchStart.scale;
    const wy = (pinchStart.cy - pinchStart.camY) / pinchStart.scale;
    cam.scale = newScale;
    cam.x = cx - wx * newScale;
    cam.y = cy - wy * newScale;
    moved = true;
    if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null; }
    applyCamera();
  } else if (panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    if (moved) {
      stopTour();
      if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null; }
      cam.x = panStart.camX + dx;
      cam.y = panStart.camY + dy;
      applyCamera();
    }
  }
});
function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (pointers.size === 0) {
    panStart = null;
    viewport.classList.remove('dragging');
    if (!moved && downPatchId && e.type === 'pointerup') openPatchById(downPatchId);
    downPatchId = null;
    setTimeout(() => { moved = false; }, 0);
  }
}
viewport.addEventListener('pointerup', releasePointer);
viewport.addEventListener('pointercancel', releasePointer);

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  stopTour();
  if (camAnim) { cancelAnimationFrame(camAnim); camAnim = null; }
  const before = screenToWorld(e.clientX, e.clientY);
  cam.scale = clamp(cam.scale * (e.deltaY < 0 ? 1.12 : 0.89), 0.05, 4);
  cam.x = e.clientX - before.x * cam.scale;
  cam.y = e.clientY - before.y * cam.scale;
  applyCamera();
}, { passive: false });

window.addEventListener('resize', applyCamera);

/* ---------- boot: whole map, then drift into the universe ---------- */
build();
fitAll(0);
const deep = new URLSearchParams(location.search).get('patch');
const deepPatch = deep && byId(deep);
setTimeout(() => {
  if (deepPatch) {
    tourIdx = Math.max(0, CONTENT.tour.indexOf(deepPatch.id));
    flyTo(deepPatch, 1300);
  } else {
    tourIdx = 0;
    flyTo(byId(CONTENT.tour[0]), 1600);
  }
}, 350);
})();
</script>
</body>
</html>
