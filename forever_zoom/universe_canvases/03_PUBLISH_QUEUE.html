<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publish Queue — Zoom Quilt</title>
  <style>
    :root {
      --bg: #080a0f;
      --panel: #12161f;
      --border: #2a3344;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #c9a227;
      --accent-glow: rgba(201, 162, 39, 0.35);
      --folk: #4a7c59;
      --metal: #8b2635;
      --ridge: #3d5a80;
      --studio: #5c4d7d;
      --myth: #2d6a6a;
      --poem: #6b4c35;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Georgia, "Times New Roman", serif; }
    #app { position: relative; width: 100%; height: 100%; }
    #viewport { cursor: grab; touch-action: none; background:
      radial-gradient(ellipse at 30% 20%, rgba(61, 90, 128, 0.15), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(139, 38, 53, 0.12), transparent 45%),
      var(--bg);
    }
    #viewport.dragging { cursor: grabbing; }
    #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    .node {
      position: absolute;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.12);
      padding: 10px 12px;
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
      user-select: none;
      backdrop-filter: blur(2px);
    }
    .node:hover { border-color: var(--accent); box-shadow: 0 0 24px var(--accent-glow); z-index: 5; }
    .node.selected { border-color: var(--accent); box-shadow: 0 0 32px var(--accent-glow); z-index: 6; }
    .node .label { font-weight: 700; font-size: 14px; line-height: 1.25; letter-spacing: 0.02em; }
    .node .sub { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: system-ui, sans-serif; }
    .node .quilt-grid {
      display: grid;
      gap: 4px;
      margin-top: 8px;
      height: calc(100% - 42px);
    }
    .quilt-cell {
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.08);
      opacity: 0.7;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2px;
      min-height: 0;
    }
    .quilt-cell.clickable {
      cursor: pointer;
      pointer-events: auto;
    }
    .quilt-cell.clickable:hover {
      opacity: 1;
      border-color: var(--accent);
      box-shadow: inset 0 0 12px var(--accent-glow);
    }
    .quilt-cell .cell-label {
      font-size: 12px;
      line-height: 1.2;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      font-family: system-ui, sans-serif;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .type-universe { background: linear-gradient(135deg, #1a1520, #2a2035); min-width: 320px; min-height: 200px; }
    .type-realm { min-width: 200px; min-height: 140px; }
    .type-realm.folk { background: linear-gradient(145deg, #1a2e1f, #0f1a12); border-color: rgba(74,124,89,0.4); }
    .type-realm.metal { background: linear-gradient(145deg, #2a1218, #1a0a0e); border-color: rgba(139,38,53,0.45); }
    .type-realm.ridge { background: linear-gradient(145deg, #152535, #0a1520); border-color: rgba(61,90,128,0.45); }
    .type-realm.studio { background: linear-gradient(145deg, #1e1830, #120e1e); border-color: rgba(92,77,125,0.45); }
    .type-realm.myth { background: linear-gradient(145deg, #122828, #081818); border-color: rgba(45,106,106,0.45); }
    .type-album { min-width: 130px; min-height: 90px; background: rgba(20,24,32,0.92); }
    .type-poem { min-width: 110px; min-height: 72px; background: rgba(30,22,16,0.9); border-color: rgba(107,76,53,0.4); }
    .type-character { min-width: 100px; min-height: 70px; background: rgba(18,28,38,0.9); border-color: rgba(61,90,128,0.35); }
    .type-tool { min-width: 120px; min-height: 80px; background: rgba(22,18,32,0.92); font-family: Consolas, monospace; font-size: 12px; }
    #hud {
      position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; flex-wrap: wrap;
      align-items: flex-start; pointer-events: none; z-index: 100;
    }
    #hud > * { pointer-events: auto; }
    .panel {
      background: rgba(18, 22, 31, 0.92); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-family: system-ui, sans-serif; font-size: 13px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 4px; font-family: Georgia, serif; }
    .panel p { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    button {
      background: #1c2330; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: #2a2410; border-color: #6b5a20; color: var(--accent); }
    #inspector-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 180;
      display: none; pointer-events: auto;
    }
    #inspector-backdrop.open { display: block; }
    #inspector {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, calc(100vw - 32px));
      max-height: min(70vh, 560px); overflow: auto; z-index: 200; display: none;
      border: 2px solid var(--accent);
      box-shadow: 0 0 48px var(--accent-glow), 0 16px 48px rgba(0,0,0,0.6);
    }
    #inspector.open { display: block; }
    #inspector h1 { font-size: 20px; }
    #inspector .body { white-space: pre-wrap; font-size: 12px; line-height: 1.5; color: #b8c0cc; margin-top: 8px; }
    #minimap {
      position: fixed; bottom: 12px; left: 12px; width: 160px; height: 110px;
      background: rgba(8,10,15,0.85); border: 1px solid var(--border); border-radius: 6px; z-index: 100;
    }
    #minimap canvas { width: 100%; height: 100%; display: block; border-radius: 5px; }
    #zoom-badge {
      position: fixed; top: 12px; right: 12px; z-index: 100;
      font-family: system-ui, sans-serif; font-size: 12px; color: var(--muted);
      background: rgba(18,22,31,0.85); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    }
    .link { color: #7eb8ff; text-decoration: none; font-size: 11px; }
    .link:hover { text-decoration: underline; }
    #help kbd { background: #1c2330; border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-size: 11px; }
  
    #boot-status {
      position: fixed; bottom: 140px; left: 12px; z-index: 200;
      background: rgba(18, 22, 31, 0.95); border: 1px solid #2a3344; border-radius: 6px;
      padding: 8px 12px; font-family: system-ui, sans-serif; font-size: 12px; color: #8b949e;
      pointer-events: none;
    }
    #boot-status.ok { color: #4a7c59; border-color: #4a7c59; }
    #boot-status.err { color: #f85149; border-color: #8b2635; background: rgba(40, 12, 18, 0.95); }

    #viewport { right: 300px; width: auto; height: 100%; position: absolute; top: 0; left: 0; }
    #nav-rail {
      position: fixed; top: 0; right: 0; width: 300px; height: 100%;
      background: #0e1218; border-left: 3px solid var(--accent);
      z-index: 300; overflow-y: auto; padding: 14px;
      font-family: system-ui, sans-serif;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    #nav-rail h2 { color: var(--accent); font-size: 15px; margin: 10px 0 6px; font-family: Georgia, serif; }
    #nav-rail .nav-home {
      display: block; color: #7eb8ff; font-size: 13px; margin-bottom: 10px; text-decoration: none;
    }
    #nav-rail .nav-home:hover { text-decoration: underline; }
    #nav-hint { color: var(--muted); font-size: 12px; line-height: 1.4; margin-bottom: 12px; }
    #nav-detail {
      background: #12161f; border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; margin-bottom: 14px;
    }
    #nav-detail h3 { color: var(--accent); font-size: 16px; margin-bottom: 4px; font-family: Georgia, serif; }
    #nav-detail .nav-type { color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 8px; }
    #nav-detail .nav-note { color: #b8c0cc; font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
    #nav-detail .nav-open-label { color: var(--muted); font-size: 11px; margin: 10px 0 6px; }
    .nav-child-btns { display: flex; flex-direction: column; gap: 6px; }
    .nav-child-btn { width: 100%; padding: 10px 12px !important; font-size: 13px !important; text-align: left; }
    #nav-list { display: flex; flex-direction: column; gap: 6px; }
    .nav-btn {
      display: block; width: 100%; text-align: left;
      padding: 12px 14px !important; font-size: 14px !important; line-height: 1.3;
      border-radius: 8px !important;
    }
    .nav-btn small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-top: 3px; }
    .nav-btn.active { border-color: var(--accent) !important; background: #2a2410 !important; color: var(--accent) !important; }
    #zoom-badge { right: 312px; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="world"></div>
  </div>
  <div id="hud">
    <div class="panel" id="help">
      <h1>Publish Queue — Zoom Quilt</h1>
      <p>Use the CLICK MENU on the right → · Drag map to pan · Scroll to zoom</p>
      <div class="btn-row">
        <button class="primary" id="btnHome">Home view</button>
        <button id="btnFit">Fit all</button>
        <button id="btnAdd">+ Note patch</button>
        <button id="btnSave">Save</button>
        <button id="btnExport">Export JSON</button>
        <button id="btnImport">Import JSON</button>
        <button id="btnReset">Reset canvas</button>
      </div>
    </div>
  </div>
    <div id="boot-status">Starting…</div>
  <div id="zoom-badge">100% · v2</div>
  <div id="minimap"><canvas id="minimapCanvas" width="160" height="110"></canvas></div>
  <div id="inspector-backdrop"></div>
  <div id="inspector" class="panel">
    <h1 id="inspTitle">—</h1>
    <p id="inspType"></p>
    <div class="body" id="inspBody"></div>
    <div class="btn-row" id="inspActions"></div>
  </div>
  <div id="nav-rail">
    <a class="nav-home" href="index.html">← All Canvases</a>
    <h2>CLICK A PATCH</h2>
    <p id="nav-hint">Every song, album, and project is a button below. Click one — map zooms and notes show up here.</p>
    <div id="nav-detail"><p class="nav-note">Loading…</p></div>
    <h2>ALL PATCHES</h2>
    <div id="nav-list"></div>
  </div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden />
<script>
const STORAGE_KEY = 'killy_canvas_publish_v1';
const WORLD_SIZE = 12000;

const DEFAULT_UNIVERSE = {
  "version": 1,
  "nodes": [
    {
      "id": "root",
      "type": "universe",
      "label": "PUBLISH QUEUE",
      "sub": "keep \u00b7 kill \u00b7 polish",
      "x": 5000,
      "y": 5000,
      "w": 400,
      "h": 240
    },
    {
      "id": "ready",
      "type": "realm",
      "realm": "folk",
      "label": "READY TO REVIEW",
      "sub": "01_POEMS folder",
      "x": 4680,
      "y": 4920,
      "w": 280,
      "h": 180,
      "parent": "root"
    },
    {
      "id": "fix",
      "type": "realm",
      "realm": "metal",
      "label": "NEEDS FIX",
      "sub": "junk + fragments",
      "x": 5280,
      "y": 4920,
      "w": 280,
      "h": 180,
      "parent": "root"
    },
    {
      "id": "in-diff",
      "type": "poem",
      "label": "IN DIFFERENCE",
      "sub": "publish candidate",
      "x": 4700,
      "y": 5140,
      "w": 150,
      "h": 80,
      "parent": "ready"
    },
    {
      "id": "hollow",
      "type": "poem",
      "label": "HOLLOW IN THE HILLS",
      "sub": "publish candidate",
      "x": 4880,
      "y": 5140,
      "w": 160,
      "h": 80,
      "parent": "ready"
    },
    {
      "id": "junk",
      "type": "tool",
      "label": "JUNK TO QUARANTINE",
      "sub": "DSP \u00b7 emails",
      "x": 5300,
      "y": 5140,
      "w": 180,
      "h": 80,
      "parent": "fix"
    },
    {
      "id": "frags",
      "type": "tool",
      "label": "2-LINE FRAGMENTS",
      "sub": "splitter bug",
      "x": 5300,
      "y": 5240,
      "w": 180,
      "h": 80,
      "parent": "fix"
    }
  ]
};

let state = loadState();
let cam = { x: 0, y: 0, scale: 0.45 };
let dragging = false;
let pointerMoved = false;
let dragStart = { x: 0, y: 0, camX: 0, camY: 0 };
let selectedId = null;

const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.nodes) && parsed.nodes.length > 0) {
        return parsed;
      }
    }
  } catch (_) {}
  try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
  return JSON.parse(JSON.stringify(DEFAULT_UNIVERSE));
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function quiltCells(node) {
  const children = state.nodes.filter(n => n.parent === node.id);
  const count = Math.max(children.length, 4);
  const cols = Math.ceil(Math.sqrt(count));
  const rows = Math.ceil(count / cols);
  let html = `<div class="quilt-grid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">`;
  const colors = { folk: 'var(--folk)', metal: 'var(--metal)', ridge: 'var(--ridge)', studio: 'var(--studio)', myth: 'var(--myth)', poem: 'var(--poem)' };
  for (let i = 0; i < cols * rows; i++) {
    const child = children[i];
    const bg = child ? (colors[child.realm] || colors[child.type] || '#333') : 'rgba(255,255,255,0.04)';
    const cls = child ? 'quilt-cell clickable' : 'quilt-cell';
    const label = child ? `<span class="cell-label">${esc(child.label)}</span>` : '';
    const data = child ? ` data-child-id="${child.id}"` : '';
    html += `<div class="${cls}"${data} style="background:${bg}">${label}</div>`;
  }
  return html + '</div>';
}

function wireQuiltCells(el) {
  el.querySelectorAll('.quilt-cell[data-child-id]').forEach(cell => {
    const id = cell.dataset.childId;
    const child = state.nodes.find(n => n.id === id);
    if (!child) return;
    cell.addEventListener('click', e => {
      e.stopPropagation();
      openPatch(id);
    });
  });
}

function render() {
  world.innerHTML = '';
  for (const node of state.nodes) {
    const el = document.createElement('div');
    el.className = 'node type-' + node.type + (node.realm ? ' ' + node.realm : '');
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    el.style.width = node.w + 'px';
    el.style.height = node.h + 'px';
    el.dataset.id = node.id;
    if (node.id === selectedId) el.classList.add('selected');
    let inner = `<div class="label">${esc(node.label)}</div>`;
    if (node.sub) inner += `<div class="sub">${esc(node.sub)}</div>`;
    if (node.type === 'realm' || node.type === 'universe') inner += quiltCells(node);
    el.innerHTML = inner;
    wireQuiltCells(el);
    el.addEventListener('click', e => {
      if (e.target.closest('.quilt-cell[data-child-id]')) return;
      e.stopPropagation();
      openPatch(node.id);
    });
    world.appendChild(el);
  }
  applyCamera();
  drawMinimap();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function applyCamera() {
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
  const zb = document.getElementById('zoom-badge');
  if (zb) zb.textContent = Math.round(cam.scale * 100) + '% · v4';
}

function screenToWorld(sx, sy) {
  const rect = viewport.getBoundingClientRect();
  return { x: (sx - rect.left - cam.x) / cam.scale, y: (sy - rect.top - cam.y) / cam.scale };
}

function zoomToNode(node, animate = true) {
  const rect = viewport.getBoundingClientRect();
  const padding = 80;
  const scaleX = (rect.width - padding * 2) / node.w;
  const scaleY = (rect.height - padding * 2) / node.h;
  const targetScale = clamp(Math.min(scaleX, scaleY), 0.2, 2.5);
  const cx = node.x + node.w / 2;
  const cy = node.y + node.h / 2;
  const targetX = rect.width / 2 - cx * targetScale;
  const targetY = rect.height / 2 - cy * targetScale;
  if (!animate) {
    cam.scale = targetScale; cam.x = targetX; cam.y = targetY;
    applyCamera(); return;
  }
  const start = { ...cam };
  const t0 = performance.now();
  const dur = 450;
  function step(now) {
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    cam.scale = start.scale + (targetScale - start.scale) * e;
    cam.x = start.x + (targetX - start.x) * e;
    cam.y = start.y + (targetY - start.y) * e;
    applyCamera();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function fitAll() {
  const nodes = state.nodes;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  }
  const rect = viewport.getBoundingClientRect();
  const pad = 60;
  const bw = maxX - minX, bh = maxY - minY;
  const scale = clamp(Math.min((rect.width - pad*2)/bw, (rect.height - pad*2)/bh), 0.08, 1.2);
  cam.scale = scale;
  cam.x = (rect.width - bw * scale) / 2 - minX * scale;
  cam.y = (rect.height - bh * scale) / 2 - minY * scale;
  applyCamera();
}

function goHome() { const n = state.nodes.find(n => n.id === 'root') || state.nodes[0]; if (n) openPatch(n.id); }

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function openPatch(id) {
  selectedId = id;
  render();
  const node = state.nodes.find(n => n.id === id);
  if (!node) return;
  updateNavDetail(node);
  buildNavList();
  zoomToNode(node);
}

function updateNavDetail(node) {
  const el = document.getElementById('nav-detail');
  if (!el) return;
  const children = state.nodes.filter(n => n.parent === node.id);
  let html = '<h3>' + esc(node.label) + '</h3>';
  html += '<p class="nav-type">' + esc(node.type + (node.realm ? ' · ' + node.realm : '')) + '</p>';
  html += '<p class="nav-note">' + esc(node.note || 'No notes on this patch yet.') + '</p>';
  if (node.parent) {
    const parent = state.nodes.find(n => n.id === node.parent);
    if (parent) {
      html += '<div class="btn-row" style="margin-top:10px"><button class="nav-back" type="button">← Back to ' + esc(parent.label) + '</button></div>';
    }
  }
  if (children.length) {
    html += '<p class="nav-open-label">Open inside this patch:</p><div class="nav-child-btns">';
    for (const c of children) {
      html += '<button type="button" class="primary nav-child-btn" data-open="' + c.id + '">' + esc(c.label) + (c.sub ? '<small style="display:block;font-weight:400;color:#8b949e">' + esc(c.sub) + '</small>' : '') + '</button>';
    }
    html += '</div>';
  }
  el.innerHTML = html;
  const back = el.querySelector('.nav-back');
  if (back && node.parent) {
    const parent = state.nodes.find(n => n.id === node.parent);
    if (parent) back.onclick = () => openPatch(parent.id);
  }
  el.querySelectorAll('[data-open]').forEach(btn => {
    btn.onclick = () => openPatch(btn.dataset.open);
  });
}

function buildNavList() {
  const list = document.getElementById('nav-list');
  if (!list) return;
  list.innerHTML = '';
  const root = state.nodes.find(n => n.id === 'root') || state.nodes[0];
  if (!root) return;
  function walk(nodeId, depth) {
    const node = state.nodes.find(n => n.id === nodeId);
    if (!node) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'nav-btn' + (selectedId === node.id ? ' active' : '');
    b.style.width = 'calc(100% - ' + (depth * 10) + 'px)';
    b.style.marginLeft = (depth * 10) + 'px';
    b.innerHTML = esc(node.label) + (node.sub ? '<small>' + esc(node.sub) + '</small>' : '');
    b.onclick = () => openPatch(node.id);
    list.appendChild(b);
    state.nodes.filter(n => n.parent === nodeId).forEach(c => walk(c.id, depth + 1));
  }
  walk(root.id, 0);
}

function closeInspector() {
  document.getElementById('inspector').classList.remove('open');
  const bd = document.getElementById('inspector-backdrop');
  if (bd) bd.classList.remove('open');
  selectedId = null;
  render();
}

function showInspector(node) {
  const children = state.nodes.filter(n => n.parent === node.id);
  const insp = document.getElementById('inspector');
  const bd = document.getElementById('inspector-backdrop');
  /* details shown in nav-rail */
  document.getElementById('inspTitle').textContent = node.label;
  document.getElementById('inspType').textContent = node.type.toUpperCase() + (node.realm ? ' · ' + node.realm : '') + (node.parent ? ' · child of ' + node.parent : '');
  if (children.length > 0) {
    document.getElementById('inspBody').textContent = node.note || ('Contains ' + children.length + ' patches — use the buttons below to open one.');
  } else {
    document.getElementById('inspBody').textContent = node.note || '(No notes on this patch yet.)';
  }
  const actions = document.getElementById('inspActions');
  actions.innerHTML = '';
  if (node.parent) {
    const parent = state.nodes.find(n => n.id === node.parent);
    if (parent) {
      const backBtn = document.createElement('button');
      backBtn.textContent = '← Back to ' + parent.label;
      backBtn.onclick = () => openPatch(parent.id);
      actions.appendChild(backBtn);
    }
  }
  for (const child of children) {
    const openBtn = document.createElement('button');
    openBtn.className = 'primary';
    openBtn.textContent = 'Open → ' + child.label;
    openBtn.onclick = () => openPatch(child.id);
    actions.appendChild(openBtn);
  }
  const fitBtn = document.createElement('button');
  fitBtn.textContent = 'See whole map';
  fitBtn.onclick = () => { closeInspector(); fitAll(); };
  actions.appendChild(fitBtn);
  if (node.type === 'poem' || node.type === 'album') {
    const pathBtn = document.createElement('button');
    pathBtn.textContent = 'Open poems folder';
    pathBtn.onclick = () => alert('Folder: Desktop\KILLY_POEMS_FOR_REVIEW\01_POEMS');
    actions.appendChild(pathBtn);
  }
}

function drawMinimap() {
  const w = minimapCanvas.width, h = minimapCanvas.height;
  minimapCtx.fillStyle = '#080a0f';
  minimapCtx.fillRect(0, 0, w, h);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of state.nodes) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  }
  const bw = maxX - minX || 1, bh = maxY - minY || 1;
  const colors = { universe: '#c9a227', folk: '#4a7c59', metal: '#8b2635', ridge: '#3d5a80', studio: '#5c4d7d', myth: '#2d6a6a', poem: '#6b4c35', album: '#556', tool: '#7a6', character: '#58a' };
  for (const n of state.nodes) {
    const mx = ((n.x - minX) / bw) * (w - 8) + 4;
    const my = ((n.y - minY) / bh) * (h - 8) + 4;
    const mw = Math.max(3, (n.w / bw) * (w - 8));
    const mh = Math.max(2, (n.h / bh) * (h - 8));
    minimapCtx.fillStyle = colors[n.realm] || colors[n.type] || '#444';
    minimapCtx.fillRect(mx, my, mw, mh);
  }
  const rect = viewport.getBoundingClientRect();
  const vx = (-cam.x / cam.scale - minX) / bw * (w - 8) + 4;
  const vy = (-cam.y / cam.scale - minY) / bh * (h - 8) + 4;
  const vw = (rect.width / cam.scale) / bw * (w - 8);
  const vh = (rect.height / cam.scale) / bh * (h - 8);
  minimapCtx.strokeStyle = '#c9a227';
  minimapCtx.lineWidth = 1.5;
  minimapCtx.strokeRect(vx, vy, vw, vh);
}

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const worldBefore = screenToWorld(e.clientX, e.clientY);
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  cam.scale = clamp(cam.scale * factor, 0.06, 4);
  cam.x = mx - worldBefore.x * cam.scale;
  cam.y = my - worldBefore.y * cam.scale;
  applyCamera();
}, { passive: false });

viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.node')) return;
  dragging = true;
  pointerMoved = false;
  viewport.classList.add('dragging');
  dragStart = { x: e.clientX, y: e.clientY, camX: cam.x, camY: cam.y };
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', e => {
  if (!dragging) return;
  if (Math.abs(e.clientX - dragStart.x) > 3 || Math.abs(e.clientY - dragStart.y) > 3) pointerMoved = true;
  cam.x = dragStart.camX + (e.clientX - dragStart.x);
  cam.y = dragStart.camY + (e.clientY - dragStart.y);
  applyCamera();
});
viewport.addEventListener('pointerup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('click', e => {
  if (pointerMoved || e.target.closest('.node')) return;
  closeInspector();
});
document.getElementById('inspector-backdrop').addEventListener('click', () => closeInspector());

document.getElementById('btnHome').onclick = goHome;
document.getElementById('btnFit').onclick = fitAll;
document.getElementById('btnSave').onclick = () => { saveState(); alert('Universe saved in this browser.'); };
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'killy-universe-quilt.json';
  a.click();
};
document.getElementById('btnImport').onclick = () => document.getElementById('importFile').click();
document.getElementById('btnReset').onclick = () => {
  if (!confirm('Reset this canvas to defaults? Your saved patches on this canvas will be lost.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = JSON.parse(JSON.stringify(DEFAULT_UNIVERSE));
  selectedId = null;
  document.getElementById('inspector').classList.remove('open');
  render();
  fitAll();
};

document.getElementById('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { state = JSON.parse(r.result); saveState(); render(); fitAll(); }
    catch { alert('Invalid JSON'); }
  };
  r.readAsText(f);
};
document.getElementById('btnAdd').onclick = () => {
  const label = prompt('Patch name (song, place, character, album…):');
  if (!label) return;
  const rect = viewport.getBoundingClientRect();
  const w = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
  const id = 'custom-' + Date.now();
  state.nodes.push({
    id, type: 'poem', label, sub: 'your patch', x: w.x - 60, y: w.y - 40, w: 120, h: 72,
    parent: selectedId || 'root', note: 'Added by you.'
  });
  saveState(); openPatch(id);
};

function setBoot(msg, ok) {
  const el = document.getElementById('boot-status');
  if (!el) return;
  el.textContent = msg;
  el.className = ok ? 'ok' : (ok === false ? 'err' : '');
}

function boot() {
  try {
    render();
    fitAll();
    const n = state.nodes.length;
    if (n === 0) {
      setBoot('ERROR: No patches loaded. Click Reset canvas.', false);
      return;
    }
    buildNavList();
    const root = state.nodes.find(n => n.id === 'root') || state.nodes[0];
    if (root) openPatch(root.id);
    setBoot('READY — use the menu on the RIGHT to click patches.', true);
    setTimeout(() => { const el = document.getElementById('boot-status'); if (el) el.style.opacity = '0.35'; }, 6000);
  } catch (err) {
    setBoot('ERROR: ' + (err && err.message ? err.message : String(err)), false);
    console.error(err);
  }
}

window.addEventListener('error', e => setBoot('ERROR: ' + (e.message || 'Script failed'), false));
window.addEventListener('resize', () => { applyCamera(); drawMinimap(); });
boot();
</script>
